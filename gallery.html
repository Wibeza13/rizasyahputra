<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Profile Riza Syahputra</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

    <style>
        html {
            scroll-behavior: smooth;
        }
        
        .nav-link {
            @apply text-gray-700 hover:text-blue-600 font-medium;
            position: relative;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 2px;
            background: #2563eb;
            left: 0;
            transition: width 0.3s;
        }
        .nav-link:hover::after,
        .nav-link.active::after {
           width: 100%;
        }

        /* Custom untuk modal backdrop */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="font-sans antialiased bg-gray-50 text-gray-800">

    <audio id="background-audio" autoplay loop muted style="display:none;">
        <source src="Nuh... - Teruntuk Mia (Official Audio).mp3" type="audio/mpeg" />
    </audio>

    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-blue-600">Profile Web</h1>

            <nav class="space-x-6 hidden md:flex" id="desktop-nav">
                <a href="index.html#home" class="nav-link transition">Home</a>
                <a href="index.html#about" class="nav-link transition">About</a>
                <a href="gallery.html" class="nav-link active transition">Gallery</a> <!-- Active di halaman ini -->
                <a href="index.html#contact" class="nav-link transition">Contact</a>
            </nav>

            <div class="md:hidden">
                <button id="menu-toggle" class="text-blue-600 focus:outline-none transition-transform duration-300">
                    <svg id="menu-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
        
        <div id="mobile-menu" class="md:hidden hidden px-4 pb-4 space-y-2 transition-all duration-300">
            <a href="index.html#home" class="block nav-link">Home</a>
            <a href="index.html#about" class="block nav-link">About</a>
            <a href="gallery.html" class="block nav-link active">Gallery</a> <!-- Active di mobile -->
            <a href="index.html#contact" class="block nav-link">Contact</a>
        </div>
    </header>
