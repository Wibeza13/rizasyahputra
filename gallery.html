    <style>
        html {
            scroll-behavior: smooth;
        }
        
        .nav-link {
            @apply text-gray-700 hover:text-blue-600 font-medium;
            position: relative;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 2px;
            background: #2563eb;
            left: 0;
            transition: width 0.3s;
        }
        .nav-link:hover::after,
        .nav-link.active::after {
           width: 100%;
        }

        /* Custom untuk modal backdrop */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
